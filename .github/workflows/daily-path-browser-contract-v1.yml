name: Daily Path Browser Contract

on:
  push:
    paths:
      - 'tests/browser/**'
      - 'src/components/charts/DailyInventoryPath*'
      - 'src/services/dailyInventoryPathService*'
      - '.github/workflows/daily-path-browser-contract-v1.yml'
  pull_request:
    paths:
      - 'tests/browser/**'
      - 'src/components/charts/DailyInventoryPath*'
      - 'src/services/dailyInventoryPathService*'
      - '.github/workflows/daily-path-browser-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing app dependencies
        run: npm install
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/daily-path-browser-tools" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/daily-path-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise actual chart using explicit synthetic fixtures
        env:
          DAILY_PATH_BROWSER_TOOLS: ${{ runner.temp }}/daily-path-browser-tools
          DAILY_PATH_BROWSER_OUTPUT: ${{ runner.temp }}/daily-path-browser-output
        run: node tests/browser/dailyInventoryPathBrowser.mjs
      - name: Upload synthetic screenshots and contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-daily-path-browser-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-path-browser-output
          if-no-files-found: ignore
          retention-days: 14
