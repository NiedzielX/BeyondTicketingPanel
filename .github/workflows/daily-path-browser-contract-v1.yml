name: Daily Path Browser Contract

on:
  push:
    paths:
      - 'tests/browser/**'
      - 'src/components/charts/DailyInventoryPath*'
      - 'src/services/dailyInventoryPathService*'
      - 'src/services/c1LiveStatus*'
      - 'src/components/common/C1LiveStatusPanel.tsx'
      - '.github/workflows/daily-path-browser-contract-v1.yml'
  pull_request:
    paths:
      - 'tests/browser/**'
      - 'src/components/charts/DailyInventoryPath*'
      - 'src/services/dailyInventoryPathService*'
      - 'src/services/c1LiveStatus*'
      - 'src/components/common/C1LiveStatusPanel.tsx'
      - '.github/workflows/daily-path-browser-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing app dependencies
        run: npm install
      - name: Verify independent C1 scoreboard contract
        run: node --experimental-strip-types --test src/services/c1LiveStatusContract.test.ts
      - name: Install isolated pinned browser tooling
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'daily-path-browser-tools'
          commands = [
              ['npm', 'install', '--prefix', str(directory), '--no-save', '--package-lock=false', 'playwright@1.56.1'],
              [str(directory / 'node_modules/.bin/playwright'), 'install', '--with-deps', 'chromium'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, flush=True)
              if result.returncode:
                  detail = result.stdout[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Isolated browser tooling failed::' + detail, flush=True)
                  raise SystemExit(result.returncode)
          PY
      - name: Exercise actual chart using explicit synthetic fixtures
        env:
          DAILY_PATH_BROWSER_TOOLS: ${{ runner.temp }}/daily-path-browser-tools
          DAILY_PATH_BROWSER_OUTPUT: ${{ runner.temp }}/daily-path-browser-output
        run: node tests/browser/dailyInventoryPathBrowser.mjs
      - name: Upload synthetic screenshots and contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-daily-path-browser-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-path-browser-output
          if-no-files-found: ignore
          retention-days: 14
