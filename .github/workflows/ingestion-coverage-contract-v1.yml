name: Ingestion Coverage Contract

on:
  push:
    paths:
      - 'src/components/operations/IngestionCoveragePanel.tsx'
      - 'src/services/ingestionCoverage*'
      - 'src/services/supabaseRest.ts'
      - 'tests/browser/ingestion*'
      - '.github/workflows/ingestion-coverage-contract-v1.yml'
  pull_request:
    paths:
      - 'src/components/operations/IngestionCoveragePanel.tsx'
      - 'src/services/ingestionCoverage*'
      - 'src/services/supabaseRest.ts'
      - 'tests/browser/ingestion*'
      - '.github/workflows/ingestion-coverage-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install app dependencies
        run: npm install
      - name: TypeScript and production build
        run: |
          npm run lint
          npm run build
      - name: Verify time partition and observation freshness contract
        run: node --experimental-strip-types --test src/services/ingestionCoverageContract.test.ts
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/ingestion-browser-tools" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/ingestion-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise ingestion monitoring using explicit synthetic fixtures
        env:
          DAILY_PATH_BROWSER_TOOLS: ${{ runner.temp }}/ingestion-browser-tools
          DAILY_PATH_BROWSER_OUTPUT: ${{ runner.temp }}/ingestion-browser-output
        run: node tests/browser/ingestionCoverageBrowser.mjs
      - name: Upload synthetic screenshots and contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ingestion-browser-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/ingestion-browser-output
          if-no-files-found: ignore
          retention-days: 14
